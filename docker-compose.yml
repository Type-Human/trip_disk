services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: trip_disk_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - trip_disk_network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trip_disk_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/trip_disk.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
    restart: unless-stopped
    networks:
      - trip_disk_network

networks:
  trip_disk_network:
    driver: bridge
